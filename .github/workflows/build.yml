name: Build AudioRelay Grabber v1.9.0 AMOLED
on:
  push:
    branches: [audiorelay-grabber-v1-9-amoled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile software LAME MP3 encoder for Android TV
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;26.3.11579264' || test -d "$ANDROID_HOME/ndk/26.3.11579264"
          git clone --depth 1 https://github.com/xieyangxuejun/libmp3lame-android.git /tmp/lame-android
          mkdir -p native-build/jni app/src/main/jniLibs
          cp -R /tmp/lame-android/jni/libmp3lame native-build/jni/
          cp -R /tmp/lame-android/jni/include native-build/jni/
          cp native/mp3_bridge.c native-build/jni/mp3_bridge.c
          cp native/Android.mk native-build/jni/Android.mk
          "$ANDROID_HOME/ndk/26.3.11579264/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/native-build" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/native-build/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/native/Application.mk" \
            NDK_OUT="$GITHUB_WORKSPACE/native-build/obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            -j 3
          find app/src/main/jniLibs -type f -name 'libtvmp3.so' -exec ls -lh {} \;
          test -s app/src/main/jniLibs/arm64-v8a/libtvmp3.so
          test -s app/src/main/jniLibs/armeabi-v7a/libtvmp3.so
      - name: Bundle Manrope font under the SIL Open Font License
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error -o app/src/main/assets/Manrope.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf'
          curl --fail --location --retry 3 --silent --show-error -o app/src/main/assets/MANROPE-OFL.txt \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt'
          test "$(wc -c < app/src/main/assets/Manrope.ttf)" -gt 10000
      - name: Compile BSD-licensed Opus audio codec for Android TV
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git /tmp/opus-source
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            cmake -S /tmp/opus-source -B "/tmp/opus-build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-29 \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
              -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
            cmake --build "/tmp/opus-build-$ABI" --parallel 3
            STATIC=$(find "/tmp/opus-build-$ABI" -name 'libopus.a' -type f | head -1)
            test -s "$STATIC"
            mkdir -p "app/src/main/jniLibs/$ABI"
            case "$ABI" in
              arm64-v8a) CC="$LLVM/aarch64-linux-android29-clang";;
              armeabi-v7a) CC="$LLVM/armv7a-linux-androideabi29-clang";;
              x86_64) CC="$LLVM/x86_64-linux-android29-clang";;
            esac
            "$CC" -std=c11 -O2 -fPIC -shared \
              native/opus_bridge.c "$STATIC" -I/tmp/opus-source/include \
              -lm -llog -o "app/src/main/jniLibs/$ABI/libtvopus.so"
            test -s "app/src/main/jniLibs/$ABI/libtvopus.so"
          done
      - name: Generate AudioRelay Grabber AMOLED logos, launcher icons and TV banner
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          ROOT=Path('app/src/main')
          RES=ROOT/'res/drawable-nodpi'
          ASSETS=ROOT/'assets'
          BLACK=(0,0,0)
          WHITE=(248,249,251)
          RED=(255,35,61)
          FONT=str(ASSETS/'Manrope.ttf')

          # Exact brand motif: white modern ring interrupted by a red REC dot.
          icon=Image.new('RGB',(512,512),BLACK)
          d=ImageDraw.Draw(icon)
          d.arc((91,91,421,421),190,530,fill=WHITE,width=10)
          d.ellipse((76,237,116,277),fill=RED)
          icon.save(RES/'grabber_launcher.png',optimize=True)

          # Header lock-up: two lines, light Manrope, black AMOLED background.
          # Original TV layout dimensions and two-column proportions stay intact.
          logo=Image.new('RGB',(900,200),BLACK)
          d=ImageDraw.Draw(logo)
          d.arc((16,24,167,175),190,530,fill=WHITE,width=6)
          d.ellipse((7,90,31,114),fill=RED)
          font=ImageFont.truetype(FONT,76)
          d.text((200,20),'AudioRelay',font=font,fill=WHITE,anchor='lt')
          d.text((200,108),'Grabber',font=font,fill=WHITE,anchor='lt')
          logo.save(ASSETS/'grabber_wordmark.webp',format='WEBP',quality=96,method=6)

          # Banner on the Android TV home screen, using the same branding.
          banner=Image.new('RGB',(640,360),BLACK)
          mark=logo.copy()
          mark.thumbnail((595,175),Image.Resampling.LANCZOS)
          banner.paste(mark,((640-mark.width)//2,(360-mark.height)//2))
          banner.save(RES/'grabber_tv_banner.png',optimize=True)

          assert (RES/'grabber_launcher.png').stat().st_size>1500
          assert (RES/'grabber_tv_banner.png').stat().st_size>1500
          assert (ASSETS/'grabber_wordmark.webp').stat().st_size>1500
          PY
      - name: Compile Android TV APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload new installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioRelay-Grabber-v1.9.0-AMOLED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
