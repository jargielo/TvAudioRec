name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utworz pliki projektu
        run: |
          mkdir -p app/src/main/java/pl/tomasz/tvaudiorec
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TvAudioRec"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "pl.tomasz.tvaudiorec"
              compileSdk = 34
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {
                  applicationId = "pl.tomasz.tvaudiorec"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application android:label="TV Audio Rec">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".RecordingService" android:exported="false" android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/pl/tomasz/tvaudiorec/MainActivity.kt <<'EOF'
          package pl.tomasz.tvaudiorec

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private val requestCapture = 1001
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  status = TextView(this).apply {
                      textSize = 26f
                      gravity = Gravity.CENTER
                      text = "Gotowy do nagrywania"
                  }
                  val startBtn = Button(this).apply {
                      text = "Start nagrywania dźwięku"
                      setOnClickListener { askForCapture() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "Stop"
                      setOnClickListener {
                          startService(
                              Intent(this@MainActivity, RecordingService::class.java)
                                  .setAction(RecordingService.ACTION_STOP)
                          )
                          status.text = "Zatrzymano. Plik jest w folderze Music aplikacji."
                      }
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(96, 96, 96, 96)
                      addView(status)
                      addView(startBtn)
                      addView(stopBtn)
                  })
                  val needed = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) needed += Manifest.permission.POST_NOTIFICATIONS
                  requestPermissions(needed.toTypedArray(), 1)
              }

              private fun askForCapture() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      status.text = "Brak uprawnienia do audio. Zaakceptuj je i spróbuj ponownie."
                      return
                  }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(mpm.createScreenCaptureIntent(), requestCapture)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == requestCapture && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, RecordingService::class.java)
                          .setAction(RecordingService.ACTION_START)
                          .putExtra("resultCode", resultCode)
                          .putExtra("data", data)
                      startForegroundService(intent)
                      status.text = "Nagrywam... (Stop na przycisku)"
                  } else {
                      status.text = "Anulowano zgodę na przechwytywanie."
                  }
              }
          }
          EOF
          cat > app/src/main/java/pl/tomasz/tvaudiorec/RecordingService.kt <<'EOF'
          package pl.tomasz.tvaudiorec

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Environment
          import android.os.IBinder
          import java.io.File
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class RecordingService : Service() {

              companion object {
                  const val ACTION_START = "start"
                  const val ACTION_STOP = "stop"
                  private const val CHANNEL_ID = "recording"
                  private const val SAMPLE_RATE = 44100
              }

              private var projection: MediaProjection? = null
              private var record: AudioRecord? = null
              private var writer: Thread? = null
              @Volatile private var running = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> startRecording(intent)
                      ACTION_STOP -> stopRecording()
                  }
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              private fun startRecording(intent: Intent) {
                  if (running) return
                  val channel = NotificationChannel(CHANNEL_ID, "Nagrywanie", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  val notification: Notification = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Nagrywanie dźwięku")
                      .setContentText("Trwa nagrywanie dźwięku systemowego")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  val resultCode = intent.getIntExtra("resultCode", 0)
                  val data: Intent = intent.getParcelableExtra("data") ?: return
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val proj = mpm.getMediaProjection(resultCode, data) ?: return
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopRecording() }
                  }, null)

                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()
                  val format = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SAMPLE_RATE)
                      .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                      .build()
                  val minBuf = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val rec = AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(config)
                      .setAudioFormat(format)
                      .setBufferSizeInBytes(minBuf * 2)
                      .build()
                  record = rec

                  val dir = getExternalFilesDir(Environment.DIRECTORY_MUSIC) ?: filesDir
                  val file = File(dir, "nagranie_${System.currentTimeMillis()}.wav")

                  running = true
                  rec.startRecording()
                  writer = Thread {
                      FileOutputStream(file).use { fos ->
                          fos.write(wavHeader(0L))
                          val buf = ByteArray(minBuf)
                          var total = 0L
                          while (running) {
                              val n = rec.read(buf, 0, buf.size)
                              if (n > 0) {
                                  fos.write(buf, 0, n)
                                  total += n
                              }
                          }
                          fos.channel.position(0)
                          fos.write(wavHeader(total))
                      }
                  }.also { it.start() }
              }

              private fun stopRecording() {
                  running = false
                  record?.stop()
                  writer?.join(5000)
                  record?.release()
                  record = null
                  writer = null
                  projection?.stop()
                  projection = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  stopRecording()
                  super.onDestroy()
              }

              private fun wavHeader(dataLen: Long): ByteArray {
                  val channels = 2
                  val bits = 16
                  val byteRate = SAMPLE_RATE * channels * bits / 8
                  val blockAlign = channels * bits / 8
                  return ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN).apply {
                      put("RIFF".toByteArray()); putInt((36 + dataLen).toInt()); put("WAVE".toByteArray())
                      put("fmt ".toByteArray()); putInt(16); putShort(1); putShort(channels.toShort())
                      putInt(SAMPLE_RATE); putInt(byteRate); putShort(blockAlign.toShort()); putShort(bits.toShort())
                      put("data".toByteArray()); putInt(dataLen.toInt())
                  }.array()
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
