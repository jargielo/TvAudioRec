name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utworz pliki projektu
        run: |
          mkdir -p app/src/main/java/pl/tomasz/tvaudiorec
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TvAudioRec"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "pl.tomasz.tvaudiorec"
              compileSdk = 34
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {
                  applicationId = "pl.n2s.tvaudiorecorder"
                  minSdk = 29
                  targetSdk = 32
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application android:label="TV Audio Recorder">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".RecordingService" android:exported="false" android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/pl/tomasz/tvaudiorec/MainActivity.kt <<'EOF'
          package pl.tomasz.tvaudiorec
          
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.MediaPlayer
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.util.Locale
          
          class MainActivity : Activity() {
              private val CAPTURE = 302
              private lateinit var status: TextView
              private lateinit var recordings: LinearLayout
              private var player: MediaPlayer? = null
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.setBackgroundColor(0xff0b1420.toInt())
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(48, 30, 48, 30)
                  }
                  setContentView(root)
                  val left = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 15, 26, 12)
                  }
                  val right = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 15, 5, 12)
                  }
                  root.addView(left, LinearLayout.LayoutParams(0, -1, 1f))
                  root.addView(right, LinearLayout.LayoutParams(0, -1, 1f))
                  fun label(value: String, size: Float, color: Int = 0xffecf6f3.toInt()): TextView =
                      TextView(this).apply { text=value; textSize=size; setTextColor(color); gravity=Gravity.CENTER_VERTICAL }
                  fun btn(value: String, click: () -> Unit): Button = Button(this).apply {
                      text = value
                      isFocusable = true
                      setOnClickListener { click() }
                  }
                  left.addView(label("TV AUDIO RECORDER", 29f, 0xff50dfaa.toInt()))
                  left.addView(label("DŹWIĘK WEWNĘTRZNY  •  AAC / M4A", 17f))
                  status = label("Gotowy do nagrywania.", 17f)
                  left.addView(status, LinearLayout.LayoutParams(-1, 0, 1f))
                  left.addView(btn("ROZPOCZNIJ NAGRYWANIE") { startCapture() })
                  left.addView(btn("ZATRZYMAJ I ZAPISZ") {
                      startService(Intent(this, RecordingService::class.java).setAction(RecordingService.STOP))
                      status.text = "Trwa zapisywanie nagrania…"
                  })
                  left.addView(btn("PRZEJDŹ DO APLIKACJI TV") {
                      startActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME))
                  })
                  right.addView(label("ZAPISANE NAGRANIA", 24f, 0xff50dfaa.toInt()))
                  right.addView(label("Pilot: strzałki i OK", 14f))
                  recordings = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val scroll = ScrollView(this).apply { addView(recordings) }
                  right.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  right.addView(btn("ODŚWIEŻ NAGRANIA") { refreshFiles() })
                  right.addView(label("Pliki: Muzyka / TVAudioRecorder", 13f))
                  refreshFiles()
              }
          
              override fun onResume() {
                  super.onResume()
                  if (::recordings.isInitialized) refreshFiles()
              }
          
              private fun startCapture() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 303)
                      status.text = "Zezwól na nagrywanie audio i ponownie wybierz START."
                      return
                  }
                  try {
                      val manager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(manager.createScreenCaptureIntent(), CAPTURE)
                  } catch (e: Exception) {
                      status.text = "System TV odmówił: " + e.message
                  }
              }
          
              @Deprecated("Android TV uses activity result")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != CAPTURE) return
                  if (resultCode != RESULT_OK || data == null) {
                      status.text = "Nie udzielono zgody na przechwytywanie."
                      return
                  }
                  startForegroundService(Intent(this, RecordingService::class.java).apply {
                      action = RecordingService.START
                      putExtra("resultCode", resultCode)
                      putExtra("data", data)
                  })
                  status.text = "Nagrywanie uruchomione. Możesz przejść do innej aplikacji."
              }
          
              private fun refreshFiles() {
                  recordings.removeAllViews()
                  val cols = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.DISPLAY_NAME)
                  try {
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, cols,
                          MediaStore.Audio.Media.RELATIVE_PATH + " LIKE ?",
                          arrayOf("Music/TVAudioRecorder/%"),
                          MediaStore.Audio.Media.DATE_ADDED + " DESC"
                      )?.use { cursor ->
                          var count=0
                          while (cursor.moveToNext() && count++ < 30) {
                              val name = cursor.getString(1) ?: "Nagranie"
                              val uri=Uri.withAppendedPath(
                                  MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, cursor.getLong(0).toString())
                              recordings.addView(Button(this).apply {
                                  text=name
                                  isFocusable=true
                                  setOnClickListener { play(uri) }
                              })
                          }
                      }
                  } catch (e: Exception) {
                      status.text = "Nie można odczytać nagrań: " + e.message
                  }
                  if (recordings.childCount == 0)
                      recordings.addView(TextView(this).apply {
                          text="Brak nagrań"; textSize=17f; setTextColor(0xffecf6f3.toInt())
                      })
              }
          
              private fun play(uri: Uri) {
                  try {
                      player?.release()
                      player=MediaPlayer().apply {
                          setDataSource(this@MainActivity, uri)
                          setOnCompletionListener { it.release(); player=null }
                          prepare()
                          start()
                      }
                      status.text="Odtwarzanie nagrania..."
                  } catch (e: Exception) { status.text="Błąd odtwarzania: " + e.message }
              }
          
              override fun onDestroy() {
                  player?.release()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/pl/tomasz/tvaudiorec/RecordingService.kt <<'EOF'
          package pl.tomasz.tvaudiorec
          
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.IBinder
          import android.os.ParcelFileDescriptor
          import android.os.PowerManager
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          class RecordingService : Service() {
              companion object {
                  const val START = "start"
                  const val STOP = "stop"
              }
              @Volatile private var active=false
              @Volatile private var record: AudioRecord?=null
              private var worker: Thread?=null
              private var projection: MediaProjection?=null
          
              override fun onBind(intent: Intent?): IBinder?=null
          
              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel("tvrec", "Nagrywanie audio TV", NotificationManager.IMPORTANCE_LOW))
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      STOP -> stopCapture()
                      START -> if (worker == null) {
                          val resultCode=intent.getIntExtra("resultCode", Activity.RESULT_CANCELED)
                          @Suppress("DEPRECATION")
                          val data=intent.getParcelableExtra<Intent>("data")
                          if (resultCode != Activity.RESULT_OK || data == null) {
                              stopSelf()
                              return START_NOT_STICKY
                          }
                          val stopPi=PendingIntent.getService(this, 1,
                              Intent(this, RecordingService::class.java).setAction(STOP),
                              PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                          val note=Notification.Builder(this, "tvrec")
                              .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                              .setContentTitle("TV Audio Recorder")
                              .setContentText("Nagrywanie dźwięku wewnętrznego do M4A")
                              .addAction(android.R.drawable.ic_media_pause, "STOP", stopPi)
                              .setOngoing(true).build()
                          startForeground(1301, note, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                          active=true
                          worker=Thread { capture(resultCode,data) }.also { it.start() }
                      }
                  }
                  return START_NOT_STICKY
              }
          
              private fun stopCapture() {
                  active=false
                  try { record?.stop() } catch (_: Exception) { }
                  if (worker == null) stopSelf()
              }
          
              private fun capture(resultCode: Int, data: Intent) {
                  var rec: AudioRecord?=null
                  var enc: MediaCodec?=null
                  var mux: MediaMuxer?=null
                  var fd: ParcelFileDescriptor?=null
                  var uri: Uri?=null
                  var muxStarted=false
                  var saved=false
                  var wake: PowerManager.WakeLock?=null
                  try {
                      wake=(getSystemService(POWER_SERVICE) as PowerManager)
                          .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TVAudioRecorder:Recording")
                      wake.acquire(12L * 60 * 60 * 1000)
                      val manager=getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val proj=manager.getMediaProjection(resultCode,data)
                          ?: error("Brak zgody MediaProjection")
                      projection=proj
                      proj.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() { stopCapture() }
                      }, Handler(Looper.getMainLooper()))
                      val config=AudioPlaybackCaptureConfiguration.Builder(proj)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN).build()
                      val rate=48000
                      val channels=2
                      val minBuffer=AudioRecord.getMinBufferSize(
                          rate, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                      check(minBuffer > 0) { "Telewizor nie obsługuje przechwytywania audio" }
                      rec=AudioRecord.Builder()
                          .setAudioPlaybackCaptureConfig(config)
                          .setAudioFormat(AudioFormat.Builder()
                              .setSampleRate(rate)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_IN_STEREO).build())
                          .setBufferSizeInBytes(minBuffer * 3).build()
                      check(rec.state == AudioRecord.STATE_INITIALIZED) { "AudioRecord: nie można uruchomić" }
                      record=rec
                      rec.startRecording()
                      val format=MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC,rate,channels).apply {
                          setInteger(MediaFormat.KEY_AAC_PROFILE,MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                          setInteger(MediaFormat.KEY_BIT_RATE,192000)
                          setInteger(MediaFormat.KEY_MAX_INPUT_SIZE,16384)
                      }
                      enc=MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                      enc.configure(format,null,null,MediaCodec.CONFIGURE_FLAG_ENCODE)
                      enc.start()
                      val name="TV_Audio_" + SimpleDateFormat("yyyy-MM-dd_HH-mm-ss",Locale.ROOT)
                          .format(Date()) + ".m4a"
                      val values=ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME,name)
                          put(MediaStore.MediaColumns.MIME_TYPE,"audio/mp4")
                          put(MediaStore.MediaColumns.RELATIVE_PATH,"Music/TVAudioRecorder/")
                          put(MediaStore.MediaColumns.IS_PENDING,1)
                      }
                      uri=contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,values)
                          ?: error("Brak dostępu do pamięci")
                      fd=contentResolver.openFileDescriptor(uri,"rw") ?: error("Błąd pliku")
                      mux=MediaMuxer(fd.fileDescriptor,MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
          
                      val encoder=enc
                      val writer=mux
                      val info=MediaCodec.BufferInfo()
                      var track=-1
                      fun drain(eos: Boolean) {
                          var attempts=0
                          while (true) {
                              val i=encoder.dequeueOutputBuffer(info,if(eos) 10000 else 0)
                              when (i) {
                                  MediaCodec.INFO_TRY_AGAIN_LATER -> {
                                      if(!eos) return
                                      if(++attempts > 3000) error("Błąd kończenia AAC")
                                  }
                                  MediaCodec.INFO_OUTPUT_FORMAT_CHANGED -> {
                                      track=writer.addTrack(encoder.outputFormat)
                                      writer.start()
                                      muxStarted=true
                                  }
                                  else -> if (i >= 0) {
                                      val buffer=encoder.getOutputBuffer(i) ?: error("Brak bufora AAC")
                                      if(info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG)==0) {
                                          check(track >= 0)
                                          buffer.position(info.offset)
                                          buffer.limit(info.offset+info.size)
                                          writer.writeSampleData(track,buffer,info)
                                      }
                                      val last=(info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM)!=0
                                      encoder.releaseOutputBuffer(i,false)
                                      if(last) return
                                  }
                              }
                          }
                      }
                      val pcm=ByteArray(16384)
                      var frames=0L
                      while(active) {
                          val i=encoder.dequeueInputBuffer(10000)
                          if(i<0) { drain(false); continue }
                          val b=encoder.getInputBuffer(i) ?: error("Brak bufora wejściowego")
                          b.clear()
                          val capacity=minOf(b.remaining(),pcm.size) / 4 * 4
                          val n=rec.read(pcm,0,capacity,AudioRecord.READ_BLOCKING)
                          if(n<=0) {
                              if(!active) break
                              error("Błąd odczytu audio: " + n)
                          }
                          val aligned=n/4*4
                          b.put(pcm,0,aligned)
                          encoder.queueInputBuffer(i,0,aligned,frames*1000000L/rate,0)
                          frames+=aligned/4
                          drain(false)
                      }
                      var lastInput=encoder.dequeueInputBuffer(10000)
                      while(lastInput<0) { drain(false); lastInput=encoder.dequeueInputBuffer(10000) }
                      encoder.queueInputBuffer(lastInput,0,0,frames*1000000L/rate,
                          MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                      drain(true)
                      saved=muxStarted
                  } catch (e: Exception) {
                      android.util.Log.e("TVAudioRecorder","Nagrywanie nieudane",e)
                  } finally {
                      active=false
                      record=null
                      try { rec?.stop() } catch (_: Exception) { }
                      try { rec?.release() } catch (_: Exception) { }
                      try { enc?.stop() } catch (_: Exception) { }
                      try { enc?.release() } catch (_: Exception) { }
                      try { if(muxStarted) mux?.stop() } catch (_: Exception) { saved=false }
                      try { mux?.release() } catch (_: Exception) { }
                      try { fd?.close() } catch (_: Exception) { }
                      if(uri != null) try {
                          if(saved) contentResolver.update(uri,ContentValues().apply {
                              put(MediaStore.MediaColumns.IS_PENDING,0)
                          },null,null) else contentResolver.delete(uri,null,null)
                      } catch (_: Exception) { }
                      try { projection?.stop() } catch (_: Exception) { }
                      projection=null
                      try { wake?.release() } catch (_: Exception) { }
                      worker=null
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Audio-Recorder-v1.0.0-M4A-APK
          path: app/build/outputs/apk/debug/app-debug.apk
