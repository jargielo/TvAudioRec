name: Build AudioRelay Grabber Android 9
on:
  push:
    branches: [grabber-android9-pie]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Render solid-black cyberpunk PNG assets
        run: |
          python3 -m pip install -q Pillow
          python3 tools/render_cyberpunk_icon.py
      - name: Build APK for Android Pie API 28
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK has raster icon, correct package and no adaptive vector
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          with ZipFile(apk) as z:
              paths=set(z.namelist())
              bitmap=[p for p in paths if p.endswith('grabber_cyberpunk.png')]
              launcher=[p for p in paths if p.endswith('/ic_launcher.png')]
              assert bitmap and len(launcher)>=5,(bitmap,launcher)
              assert not any(p.endswith('grabber_cyberpunk.xml') for p in paths)
              assert not any(p.endswith('mipmap-anydpi-v26/ic_launcher.xml') for p in paths)
              assert z.read(bitmap[0])[:8] == bytes([137,80,78,71,13,10,26,10])
              print('Verified raster asset',bitmap,'and launcher images',launcher)
          PY
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AudioRelay-Grabber-v1.9.6-Huawei-P20-Lite-AMOLED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioRelay-Grabber-v1.9.6-Android9-AMOLED
          path: AudioRelay-Grabber-v1.9.6-Huawei-P20-Lite-AMOLED.apk
          if-no-files-found: error
