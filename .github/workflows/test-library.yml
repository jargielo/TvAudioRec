name: Verify WAV and Opus recordings on Android 12
on:
  push:
    branches: [tv-audio-recorder-v1-6-amoled-manrope]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-library:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Add exact AudioRelay launcher icon and Manrope for tests
        shell: bash
        run: |
          mkdir -p app/src/main/assets/fonts app/src/main/res/drawable-nodpi
          base64 -d design/brand-logo.jpg.base64 > app/src/main/assets/brand_logo.jpg
          cp app/src/main/assets/brand_logo.jpg app/src/main/res/drawable-nodpi/ic_launcher.jpg
          cp app/src/main/assets/brand_logo.jpg app/src/main/res/drawable-nodpi/tv_banner.jpg
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o app/src/main/assets/fonts/manrope.ttf
      - name: Enable KVM for Android emulator
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm || true
      - name: Save a real WAV file and verify it appears in the library
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
